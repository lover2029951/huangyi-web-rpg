<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>山海經武魂預覽</title>
<style>
  body { margin: 0; background: #0a0a0c; color: #c9b27c; font-family: "Microsoft JhengHei", sans-serif; text-align: center; }
  h2 { font-weight: normal; letter-spacing: 4px; margin: 24px 0 8px; }
  .hint { font-size: 13px; opacity: .6; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 300px); gap: 28px; justify-content: center; padding: 16px 24px 48px; }
  .card { background: #111116; border: 1px solid #2a2a30; padding: 8px; }
  .stage { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden;
           background: radial-gradient(circle at 50% 50%, #1b1b22 0%, #050507 70%); }
  .stage img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* body stays still (layers are already normalized to the full canvas) */
  .stage .body { left: 0; top: 0; width: 100%; height: 100%; }
  /* ring rotates on its own layer */
  .stage .ring { animation: spin 10s linear infinite; }
  .stage .ring.rev { animation-direction: reverse; animation-duration: 14s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .name { margin-top: 8px; font-size: 16px; letter-spacing: 3px; }
</style>
</head>
<body>
<h2>山海經武魂 ・ 本體不動，光圈單獨旋轉</h2>
<div class="hint">本體半透明魂體；光圈比本體更透明，獨立旋轉</div>
<div class="grid">
  <div class="card"><div class="stage"><img class="ring" src="jiuweihu_ring.png" alt=""><img class="body" src="jiuweihu_body.png" alt=""></div><div class="name">九尾狐</div></div>
  <div class="card"><div class="stage"><img class="ring rev" src="baize_ring.png" alt=""><img class="body" src="baize_body.png" alt=""></div><div class="name">白澤</div></div>
  <div class="card"><div class="stage"><img class="ring" src="taotie_ring.png" alt=""><img class="body" src="taotie_body.png" alt=""></div><div class="name">饕餮</div></div>
  <div class="card"><div class="stage"><img class="ring rev" src="luwu_ring.png" alt=""><img class="body" src="luwu_body.png" alt=""></div><div class="name">陸吾</div></div>
  <div class="card"><div class="stage"><img class="ring" src="jiuying_ring.png" alt=""><img class="body" src="jiuying_body.png" alt=""></div><div class="name">九嬰</div></div>
  <div class="card"><div class="stage"><img class="ring rev" src="kaiming_ring.png" alt=""><img class="body" src="kaiming_body.png" alt=""></div><div class="name">開明獸</div></div>
</div>
</body>
</html>
